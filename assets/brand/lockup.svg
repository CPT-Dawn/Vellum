<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160" role="img" aria-labelledby="t">
  <title id="t">Vellum</title>
  <defs>
    <linearGradient id="i-canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1B2E"/>
      <stop offset="1" stop-color="#0B0D14"/>
    </linearGradient>
    <radialGradient id="i-bloom" cx="0.62" cy="0.58" r="0.55">
      <stop offset="0" stop-color="#8DE3DC" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8DE3DC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="i-glassBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B7F86" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#173A40" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="i-glassFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E9EA2" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#1B4549" stop-opacity="0.40"/>
    </linearGradient>
    <linearGradient id="i-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8F2EC" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8DE3DC" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="i-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="i-glowTight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <clipPath id="i-tile"><rect width="128" height="128" rx="28"/></clipPath>
  </defs>
  <g transform="translate(16 16)">
  <g clip-path="url(#i-tile)">
    <rect width="128" height="128" fill="url(#i-canvas)"/>
    <rect width="128" height="128" fill="url(#i-bloom)"/>
    <!-- two overlapping vellum sheets in smoked teal glass -->
    <rect x="22" y="20" width="62" height="78" rx="12" transform="rotate(-10 53 59)"
          fill="url(#i-glassBack)" stroke="url(#i-edge)" stroke-width="1.5"/>
    <rect x="42" y="32" width="62" height="78" rx="12" transform="rotate(6 73 71)"
          fill="url(#i-glassFront)" stroke="url(#i-edge)" stroke-width="1.5"/>
    <!-- handwritten v: wide bloom, tight glow, mint core, hot highlight -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M36 50 C 42 52, 47 66, 56 86 C 58 90, 60 90, 62 86 C 70 68, 80 50, 96 38" stroke="#8DE3DC" stroke-width="14" opacity="0.45" filter="url(#i-glow)"/>
      <path d="M36 50 C 42 52, 47 66, 56 86 C 58 90, 60 90, 62 86 C 70 68, 80 50, 96 38" stroke="#8DE3DC" stroke-width="10" opacity="0.6" filter="url(#i-glowTight)"/>
      <path d="M36 50 C 42 52, 47 66, 56 86 C 58 90, 60 90, 62 86 C 70 68, 80 50, 96 38" stroke="#8DE3DC" stroke-width="8"/>
      <path d="M36 50 C 42 52, 47 66, 56 86 C 58 90, 60 90, 62 86 C 70 68, 80 50, 96 38" stroke="#E6FFFC" stroke-width="2.4" opacity="0.85"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#C0CAF5" stroke-opacity="0.08" stroke-width="1.5"/>
  </g>
