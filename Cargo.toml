[workspace]
resolver = "3"
members = ["crates/vellum-ipc", "crates/vellumd", "crates/vellum"]

[workspace.package]
version = "2.0.0-dev"
authors = ["CPT-Dawn <ping@cptdawn.dev>"]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CPT-Dawn/Vellum"

[workspace.dependencies]
vellum-ipc = { path = "crates/vellum-ipc", version = "2.0.0-dev" }
rustix = { version = "1.1.6", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
