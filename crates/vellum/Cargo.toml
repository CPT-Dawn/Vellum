[package]
name = "vellum"
description = "Wayland wallpaper manager: CLI, TUI and renderer for vellumd"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["wayland", "wallpaper", "layer-shell", "tui", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[lints]
workspace = true

[dependencies]
vellum-ipc.workspace = true
rustix = { workspace = true, features = ["net", "fs", "mm", "process"] }
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
fast_image_resize = "6.1.0"
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image"], optional = true }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
shlex = "2.0.1"

[dev-dependencies]
tempfile = "3.27.0"

[features]
# JPEG, PNG and WebP are always built in. AVIF and JXL are opt-in (ADR 0002).
# AVIF decodes through the system dav1d library.
avif = ["image/avif-native"]
jxl = ["dep:jxl-oxide"]
