[package]
name = "vellumd"
description = "The featherweight Vellum wallpaper daemon for Wayland"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
vellum-ipc.workspace = true
rustix = { workspace = true, features = ["net", "fs", "event", "mm", "process", "param"] }
waybackend = "0.11.0"

[build-dependencies]
waybackend-scanner = { version = "0.11.0", features = ["build-script"] }
