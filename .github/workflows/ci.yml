name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, tests (incl. headless-Sway e2e)
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 ships Sway 1.9 (wlroots 0.17): no alpha-modifier, so the
    # GPU Fade can't be tested, and it clears bare Monitors to grey. Arch has
    # a current Sway, like the AUR package's users.
    container:
      image: archlinux:base-devel
      # Arch's sway carries cap_sys_nice; without it in the bounding set,
      # exec fails with EPERM. Docker's 64 MiB /dev/shm is too small for
      # parallel headless Sways with 1440p Monitors: they die of SIGBUS.
      options: --cap-add SYS_NICE --shm-size 1g
    steps:
      - name: Install git, sway and grim
        run: pacman -Syu --noconfirm --needed git sway grim

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # Idle RSS and wakeups are gated by crates/vellum/tests/lightness.rs above.
      - name: Release build size
        env:
          VELLUMD_SIZE_BUDGET: 655360 # 640 KiB; vellumd is ~453 KiB at #15
        run: |
          cargo build --release --workspace --locked
          ls -l target/release/vellumd target/release/vellum
          size=$(stat -c %s target/release/vellumd)
          if [ "$size" -gt "$VELLUMD_SIZE_BUDGET" ]; then
            echo "::error::vellumd is $size bytes, over the $VELLUMD_SIZE_BUDGET byte budget"
            exit 1
          fi
          # Test-only switches exist in debug builds only.
          if grep -aqE 'VELLUMD_(NO_ALPHA_MODIFIER|CPU_FADE_MAX_MS)' target/release/vellumd; then
            echo "::error::the release vellumd honors a test-only switch"
            exit 1
          fi
