name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, tests (incl. headless-Sway e2e)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install sway and grim for the e2e harness
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sway grim

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # Idle RSS and wakeups are gated by crates/vellum/tests/lightness.rs above.
      - name: Release build size
        env:
          VELLUMD_SIZE_BUDGET: 655360 # 640 KiB; vellumd is ~453 KiB at #15
        run: |
          cargo build --release --workspace --locked
          ls -l target/release/vellumd target/release/vellum
          size=$(stat -c %s target/release/vellumd)
          if [ "$size" -gt "$VELLUMD_SIZE_BUDGET" ]; then
            echo "::error::vellumd is $size bytes, over the $VELLUMD_SIZE_BUDGET byte budget"
            exit 1
          fi
          # Test-only switches exist in debug builds only.
          if grep -aq VELLUMD_NO_ALPHA_MODIFIER target/release/vellumd; then
            echo "::error::the release vellumd honors a test-only switch"
            exit 1
          fi
