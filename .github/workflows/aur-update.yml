name: Update AUR Package

# Called by release.yml after the GitHub Release exists (a release created
# with GITHUB_TOKEN never fires `release: published`). Run it by hand with
# dry_run to build the PKGBUILD for a tag without pushing to the AUR.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (example: v2.0.0)"
        required: true
        type: string
      dry_run:
        description: "Build and verify only; do not push to the AUR"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v2.0.0)"
        required: true
        type: string
      dry_run:
        description: "Build and verify only; do not push to the AUR"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  aur-update:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git openssh rust

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Create an unprivileged build user
        run: |
          useradd -m builder
          install -d -o builder -g builder /build /build/aur-repo

      - name: Configure SSH for AUR
        if: ${{ !inputs.dry_run }}
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"

          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "AUR_SSH_PRIVATE_KEY is empty." >&2
            exit 1
          fi

          if grep -q "BEGIN .*PRIVATE KEY" <<< "$AUR_SSH_PRIVATE_KEY"; then
            printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/aur"
          else
            printf '%s' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r\n' | base64 -d > "$HOME/.ssh/aur"
          fi
          chmod 600 "$HOME/.ssh/aur"

          if ! ssh-keygen -y -f "$HOME/.ssh/aur" > /dev/null 2>&1; then
            echo "Invalid private key in AUR_SSH_PRIVATE_KEY." >&2
            exit 1
          fi

          ssh-keyscan -t rsa,ed25519 aur.archlinux.org >> "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" << 'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Clone AUR repository
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git clone ssh://aur@aur.archlinux.org/vellum.git /build/aur-repo
          chown -R builder:builder /build/aur-repo

      - name: Generate PKGBUILD and .SRCINFO
        run: >
          sudo -u builder env
          RELEASE_TAG="$TAG"
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY"
          GITHUB_SERVER_URL="$GITHUB_SERVER_URL"
          AUR_MAINTAINER="CPT-Dawn <ping@cptdawn.dev>"
          PKGREL=1
          bash .github/scripts/generate_aur_files.sh /build/aur-repo

      - name: Build the package from the generated PKGBUILD
        run: |
          set -euo pipefail
          install -d -o builder -g builder /build/check
          sudo -u builder cp /build/aur-repo/PKGBUILD /build/check/
          cd /build/check
          sudo -u builder makepkg --noconfirm
          files=$(pacman -Qlpq ./*.pkg.tar.*)
          for want in \
            /usr/bin/vellum /usr/bin/vellumd \
            /usr/lib/systemd/user/vellumd.service \
            /usr/share/bash-completion/completions/vellum \
            /usr/share/zsh/site-functions/_vellum \
            /usr/share/fish/vendor_completions.d/vellum.fish \
            /usr/share/man/man1/vellum.1.gz \
            /usr/share/licenses/vellum/LICENSE-MIT \
            /usr/share/licenses/vellum/LICENSE-APACHE; do
            grep -qx "$want" <<< "$files" || { echo "::error::package lacks $want"; exit 1; }
          done

      - name: Commit and push AUR changes
        if: ${{ !inputs.dry_run }}
        working-directory: /build/aur-repo
        run: |
          set -euo pipefail
          git config --global --add safe.directory /build/aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No PKGBUILD or .SRCINFO changes detected."
            exit 0
          fi

          pkgver=$(awk -F= '/^pkgver=/{print $2}' PKGBUILD)
          git commit -m "vellum: update to ${pkgver}"
          git push origin master
