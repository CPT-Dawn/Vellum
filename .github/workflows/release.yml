name: Release

# Pushing a version tag (v2.0.0, v2.0.0-rc.1) is the maintainer's approval:
# it publishes GitHub Releases, crates.io and the AUR. Nothing else does.
# For a second gate, add required reviewers to the `release` environment in
# the repository settings: the GitHub Release job waits in it, and crates.io
# and the AUR wait on that job. Publishing needs the CARGO_REGISTRY_TOKEN and
# AUR_SSH_PRIVATE_KEY secrets.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: tag matches the crates, packages build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Tag equals the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for crate in vellum-ipc vellumd vellum-wallpaper; do
            have=$(cargo metadata --no-deps --format-version 1 --locked \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            if [[ "$have" != "$version" ]]; then
              echo "::error::tag $TAG does not match $crate $have" >&2
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Crates package and build (dry run)
        run: cargo publish --workspace --dry-run --locked

  build:
    name: build ${{ matrix.target }}
    needs: verify
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Pack tarball
        run: >
          bash .github/scripts/package_release.sh
          "${{ needs.verify.outputs.version }}" "${{ matrix.target }}"
          target/release dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Vellum $TAG" \
            --generate-notes \
            "${flags[@]}"

  crates:
    name: crates.io
    needs: github-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # vellumd and vellum depend on vellum-ipc, so it goes first. cargo waits
      # for each crate to reach the index before the next publish resolves it.
      - name: Publish vellum-ipc
        run: cargo publish --locked -p vellum-ipc
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish vellumd
        run: cargo publish --locked -p vellumd
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish vellum-wallpaper
        run: cargo publish --locked -p vellum-wallpaper
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  aur:
    name: AUR
    needs: [verify, github-release]
    # The AUR tracks stable releases only.
    if: needs.verify.outputs.prerelease == 'false'
    uses: ./.github/workflows/aur-update.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
