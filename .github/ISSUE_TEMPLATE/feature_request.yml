name: Feature request
description: Something Vellum should do
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The solution you'd like
      description: Optional. Vellum stays a static-wallpaper tool with a zero-wakeup Daemon (see docs/adr), so animated wallpapers are out of scope.
