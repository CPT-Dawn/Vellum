# cargo-deny: licenses, advisories, bans and sources. Run `cargo deny check`.
# CI runs it in .github/workflows/deny.yml.

[graph]
all-features = true

[advisories]
# Every RustSec advisory, including unmaintained and unsound crates, fails.
yanked = "deny"

[licenses]
# Vellum is MIT OR Apache-2.0, so dependencies must be permissive. The one
# exception is MPL-2.0 (file-level copyleft, mp4parse behind the opt-in
# `avif` feature), which allows shipping a combined work under our licenses.
# waybackend has no license field; its LICENSE file is detected as MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace carry a version for publishing.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
